<!-- CONSTELLATION-BG-START -->
<script>
(() => {
  const sets = [
    [
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#00f0ff" stroke-opacity="0.45" stroke-width="1"><line x1="16" y1="8" x2="36" y2="10"/><line x1="16" y1="8" x2="22" y2="21"/><line x1="36" y1="10" x2="32" y2="23"/><line x1="22" y1="21" x2="27" y2="22"/><line x1="27" y1="22" x2="32" y2="23"/><line x1="22" y1="21" x2="18" y2="36"/><line x1="32" y1="23" x2="38" y2="34"/><line x1="18" y1="36" x2="38" y2="34"/></g><g fill="#e6f4ff"><circle cx="16" cy="8" r="1.7"/><circle cx="36" cy="10" r="1.5"/><circle cx="22" cy="21" r="1.4"/><circle cx="27" cy="22" r="1.4"/><circle cx="32" cy="23" r="1.4"/><circle cx="18" cy="36" r="1.6"/><circle cx="38" cy="34" r="1.7"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">ORION</text></svg>',
      '<svg viewBox="0 0 120 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="10,16 24,28 38,18 52,30 66,16"/></g><g fill="#e6f4ff"><circle cx="10" cy="16" r="1.6"/><circle cx="24" cy="28" r="1.5"/><circle cx="38" cy="18" r="1.7"/><circle cx="52" cy="30" r="1.5"/><circle cx="66" cy="16" r="1.6"/></g><text x="74" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CASSIOPEIA</text></svg>'
    ],
    [
      '<svg viewBox="0 0 125 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="8,14 22,16 32,21 42,26 56,24 58,34 44,35 42,26"/></g><g fill="#e6f4ff"><circle cx="8" cy="14" r="1.5"/><circle cx="22" cy="16" r="1.5"/><circle cx="32" cy="21" r="1.5"/><circle cx="42" cy="26" r="1.5"/><circle cx="56" cy="24" r="1.7"/><circle cx="58" cy="34" r="1.6"/><circle cx="44" cy="35" r="1.5"/></g><text x="66" y="25" fill="#7c93b0" font-size="8" font-family="monospace">URSA MAJOR</text></svg>',
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#ff2a85" stroke-opacity="0.45" stroke-width="1"><line x1="26" y1="8" x2="26" y2="36"/><line x1="12" y1="22" x2="40" y2="18"/></g><g fill="#e6f4ff"><circle cx="26" cy="8" r="1.8"/><circle cx="26" cy="20" r="1.6"/><circle cx="26" cy="36" r="1.5"/><circle cx="12" cy="22" r="1.4"/><circle cx="40" cy="18" r="1.4"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CYGNUS</text></svg>'
    ]
  ];

  let currentIdx = 0;

  function renderStrip(el) {
    el.innerHTML = sets[currentIdx].join('');
  }

  function inject() {
    if (document.querySelector('.constellation-strip')) return true;
    const container = document.querySelector('main') || document.querySelector('#root > div');
    if (!container || container.children.length < 2) return false;
    const strip = document.createElement('div');
    strip.className = 'constellation-strip';
    renderStrip(strip);
    container.insertBefore(strip, container.children[1]);
    return true;
  }

  window.addEventListener('deviceorientation', (e) => {
    if (typeof e.alpha !== 'number') return;
    const idx = ((e.alpha % 360) + 360) % 360 < 180 ? 0 : 1;
    if (idx !== currentIdx) {
      currentIdx = idx;
      const el = document.querySelector('.constellation-strip');
      if (el) renderStrip(el);
    }
  }, true);

  const timer = setInterval(() => {
    if (inject()) clearInterval(timer);
  }, 300);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- CONSTELLATION-BG-END -->

<!-- TELESCOPE-FEEDS-START -->
<style>
  #telescope-feeds {
    width: 100%;
    max-width: 1280px;
    margin: 14px auto 72px auto;
    padding: 0 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .tel-card {
    background: rgba(5, 9, 17, 0.95);
    border: 1px solid rgba(0, 240, 255, 0.28);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tel-card.jwst {
    border-color: rgba(255, 184, 0, 0.34);
  }
  .tel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: #00f0ff;
  }
  .tel-card.jwst .tel-head {
    color: #ffb800;
  }
  .tel-live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tel-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #39ff14;
    box-shadow: 0 0 8px #39ff14;
  }
  .tel-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  .tel-stage iframe,
  .tel-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .tel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 10px;
    color: #7c93b0;
  }
  .tel-actions {
    display: flex;
    gap: 5px;
  }
  .tel-btn {
    background: rgba(255, 255, 255, 0.06);
    color: #e6f4ff;
    border: 1px solid rgba(0, 240, 255, 0.28);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 10px;
    font-family: inherit;
    cursor: pointer;
  }
  .tel-btn.active {
    border-color: #39ff14;
    color: #39ff14;
  }
</style>
<script>
(() => {
  const FEEDS = {
    hst: {
      title: 'HUBBLE // LIVE FEED',
      cls: '',
      embedUrl: 'https://spacetelescopelive.org/hubble',
      accent: '#00f0ff',
      targets: [
        { name: 'NGC 1300', inst: 'WFC3/UVIS', band: 'OPTICAL', ra: '03h 19m 41s', dec: '-19° 24′ 41″' },
        { name: 'M51 WHIRLPOOL', inst: 'ACS/WFC', band: 'H-ALPHA', ra: '13h 29m 52s', dec: '+47° 11′ 43″' },
        { name: 'VEIL NEBULA', inst: 'WFC3/IR', band: 'NARROWBAND', ra: '20h 45m 38s', dec: '+30° 42′ 30″' }
      ]
    },
    jwst: {
      title: 'JAMES WEBB // LIVE FEED',
      cls: 'jwst',
      embedUrl: 'https://spacetelescopelive.org/webb',
      accent: '#ffb800',
      targets: [
        { name: 'CARINA RIM', inst: 'NIRCam/MIRI', band: 'NEAR/MID-IR', ra: '10h 45m 08s', dec: '-59° 52′ 04″' },
        { name: 'SMACS 0723', inst: 'NIRCam', band: 'DEEP IR', ra: '07h 23m 19s', dec: '-73° 27′ 15″' },
        { name: 'WASP-39b', inst: 'NIRSpec', band: 'SPECTRA', ra: '14h 29m 18s', dec: '-03° 26′ 40″' }
      ]
    }
  };

  function startInPageFeed(key, cfg) {
    const cvs = document.getElementById('tel-cvs-' + key);
    const ctx = cvs.getContext('2d');
    const stars = Array.from({ length: 75 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.4 + 0.3,
      a: Math.random()
    }));

    function render(now) {
      const w = cvs.clientWidth || 320;
      const h = cvs.clientHeight || 200;
      if (cvs.width !== w || cvs.height !== h) {
        cvs.width = w;
        cvs.height = h;
      }
      const t = now * 0.001;
      const slot = Math.floor(t / 15) % cfg.targets.length;
      const tgt = cfg.targets[slot];

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      const grad = ctx.createRadialGradient(w * 0.52, h * 0.48, 8, w * 0.52, h * 0.48, Math.min(w, h) * 0.45);
      grad.addColorStop(0, key === 'jwst' ? 'rgba(255, 184, 0, 0.22)' : 'rgba(0, 240, 255, 0.20)');
      grad.addColorStop(0.55, 'rgba(180, 76, 255, 0.08)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.3 + s.a * 10));
        ctx.fillStyle = 'rgba(230, 244, 255, ' + tw.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const cx = w * 0.52 + Math.sin(t * 0.25) * 10;
      const cy = h * 0.48 + Math.cos(t * 0.2) * 8;
      ctx.strokeStyle = cfg.accent;
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - 24, cy - 24, 48, 48);

      ctx.fillStyle = '#e6f4ff';
      ctx.font = '10px monospace';
      ctx.fillText('TARGET: ' + tgt.name + ' [' + tgt.band + ']', 10, 16);
      ctx.fillStyle = cfg.accent;
      ctx.fillText(tgt.inst + ' · RA ' + tgt.ra + ' · DEC ' + tgt.dec, 10, h - 10);

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }

  function makeCard(key) {
    const cfg = FEEDS[key];
    const card = document.createElement('div');
    card.className = 'tel-card ' + cfg.cls;
    card.innerHTML =
      '<div class="tel-head">' +
        '<span class="tel-live"><span class="tel-dot"></span>' + cfg.title + '</span>' +
        '<span id="tel-mode-' + key + '" style="font-size:10px;color:#39ff14">IN-PAGE STREAM</span>' +
      '</div>' +
      '<div class="tel-stage">' +
        '<canvas id="tel-cvs-' + key + '"></canvas>' +
        '<iframe id="tel-ifr-' + key + '" src="' + cfg.embedUrl + '" loading="lazy" style="display:none"></iframe>' +
      '</div>' +
      '<div class="tel-bar">' +
        '<span id="tel-clk-' + key + '">SYNCED</span>' +
        '<div class="tel-actions">' +
          '<button class="tel-btn active" id="tel-b-sim-' + key + '">IN-PAGE FEED</button>' +
          '<button class="tel-btn" id="tel-b-emb-' + key + '">EMBEDDED VIEW</button>' +
        '</div>' +
      '</div>';
    return card;
  }

  function wireCard(key) {
    const cfg = FEEDS[key];
    startInPageFeed(key, cfg);
    const cvs = document.getElementById('tel-cvs-' + key);
    const ifr = document.getElementById('tel-ifr-' + key);
    const bSim = document.getElementById('tel-b-sim-' + key);
    const bEmb = document.getElementById('tel-b-emb-' + key);
    const mode = document.getElementById('tel-mode-' + key);
    const clk = document.getElementById('tel-clk-' + key);

    bSim.onclick = () => {
      cvs.style.display = 'block';
      ifr.style.display = 'none';
      bSim.classList.add('active');
      bEmb.classList.remove('active');
      mode.textContent = 'IN-PAGE STREAM';
    };

    bEmb.onclick = () => {
      cvs.style.display = 'none';
      ifr.style.display = 'block';
      bEmb.classList.add('active');
      bSim.classList.remove('active');
      mode.textContent = 'EMBEDDED FEED';
    };

    setInterval(() => {
      clk.textContent = 'LIVE · ' + new Date().toLocaleTimeString();
    }, 1000);
  }

  function mount() {
    if (document.getElementById('telescope-feeds')) return true;
    const host = document.querySelector('main') || document.getElementById('root') || document.body;
    if (!host) return false;
    const wrap = document.createElement('section');
    wrap.id = 'telescope-feeds';
    wrap.appendChild(makeCard('hst'));
    wrap.appendChild(makeCard('jwst'));
    host.appendChild(wrap);
    wireCard('hst');
    wireCard('jwst');
    return true;
  }

  const timer = setInterval(() => {
    if (mount()) clearInterval(timer);
  }, 350);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- TELESCOPE-FEEDS-END -->
</body>
</html>
