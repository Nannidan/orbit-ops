<!-- CONSTELLATION-BG-START -->
<script>
(() => {
  const sets = [
    [
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#00f0ff" stroke-opacity="0.45" stroke-width="1"><line x1="16" y1="8" x2="36" y2="10"/><line x1="16" y1="8" x2="22" y2="21"/><line x1="36" y1="10" x2="32" y2="23"/><line x1="22" y1="21" x2="27" y2="22"/><line x1="27" y1="22" x2="32" y2="23"/><line x1="22" y1="21" x2="18" y2="36"/><line x1="32" y1="23" x2="38" y2="34"/><line x1="18" y1="36" x2="38" y2="34"/></g><g fill="#e6f4ff"><circle cx="16" cy="8" r="1.7"/><circle cx="36" cy="10" r="1.5"/><circle cx="22" cy="21" r="1.4"/><circle cx="27" cy="22" r="1.4"/><circle cx="32" cy="23" r="1.4"/><circle cx="18" cy="36" r="1.6"/><circle cx="38" cy="34" r="1.7"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">ORION</text></svg>',
      '<svg viewBox="0 0 120 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="10,16 24,28 38,18 52,30 66,16"/></g><g fill="#e6f4ff"><circle cx="10" cy="16" r="1.6"/><circle cx="24" cy="28" r="1.5"/><circle cx="38" cy="18" r="1.7"/><circle cx="52" cy="30" r="1.5"/><circle cx="66" cy="16" r="1.6"/></g><text x="74" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CASSIOPEIA</text></svg>'
    ],
    [
      '<svg viewBox="0 0 125 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="8,14 22,16 32,21 42,26 56,24 58,34 44,35 42,26"/></g><g fill="#e6f4ff"><circle cx="8" cy="14" r="1.5"/><circle cx="22" cy="16" r="1.5"/><circle cx="32" cy="21" r="1.5"/><circle cx="42" cy="26" r="1.5"/><circle cx="56" cy="24" r="1.7"/><circle cx="58" cy="34" r="1.6"/><circle cx="44" cy="35" r="1.5"/></g><text x="66" y="25" fill="#7c93b0" font-size="8" font-family="monospace">URSA MAJOR</text></svg>',
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#ff2a85" stroke-opacity="0.45" stroke-width="1"><line x1="26" y1="8" x2="26" y2="36"/><line x1="12" y1="22" x2="40" y2="18"/></g><g fill="#e6f4ff"><circle cx="26" cy="8" r="1.8"/><circle cx="26" cy="20" r="1.6"/><circle cx="26" cy="36" r="1.5"/><circle cx="12" cy="22" r="1.4"/><circle cx="40" cy="18" r="1.4"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CYGNUS</text></svg>'
    ]
  ];

  let currentIdx = 0;

  function renderStrip(el) {
    el.innerHTML = sets[currentIdx].join('');
  }

  function inject() {
    if (document.querySelector('.constellation-strip')) return true;
    const container = document.querySelector('main') || document.querySelector('#root > div');
    if (!container || container.children.length < 2) return false;
    const strip = document.createElement('div');
    strip.className = 'constellation-strip';
    renderStrip(strip);
    container.insertBefore(strip, container.children[1]);
    return true;
  }

  window.addEventListener('deviceorientation', (e) => {
    if (typeof e.alpha !== 'number') return;
    const idx = ((e.alpha % 360) + 360) % 360 < 180 ? 0 : 1;
    if (idx !== currentIdx) {
      currentIdx = idx;
      const el = document.querySelector('.constellation-strip');
      if (el) renderStrip(el);
    }
  }, true);

  const timer = setInterval(() => {
    if (inject()) clearInterval(timer);
  }, 300);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- CONSTELLATION-BG-END -->

<!-- TELESCOPE-FEEDS-START -->
<style>
  #telescope-feeds {
    width: 100%;
    max-width: 1280px;
    margin: 14px auto 72px auto;
    padding: 0 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .obs-card {
    background: rgba(6, 10, 18, 0.94);
    border: 1px solid rgba(0, 240, 255, 0.28);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .obs-card.jwst {
    border-color: rgba(255, 184, 0, 0.32);
  }
  .obs-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
  }
  .obs-name {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #00f0ff;
  }
  .obs-card.jwst .obs-name {
    color: #ffb800;
  }
  .obs-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #39ff14;
    box-shadow: 0 0 8px #39ff14;
  }
  .obs-ext {
    color: #e6f4ff;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 10px;
  }
  .obs-target {
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 9px;
  }
  .obs-label {
    font-size: 9px;
    color: #7c93b0;
    text-transform: uppercase;
  }
  .obs-val {
    font-size: 13px;
    font-weight: 700;
    color: #e6f4ff;
    margin-top: 2px;
  }
  .obs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .obs-cell {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 7px;
    padding: 6px;
  }
  .obs-cell b {
    display: block;
    font-size: 11px;
    color: #00f0ff;
    margin-top: 2px;
  }
  .obs-card.jwst .obs-cell b {
    color: #ffb800;
  }
  .obs-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: #7c93b0;
  }
  .obs-refresh {
    background: rgba(0, 240, 255, 0.1);
    color: #00f0ff;
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 10px;
    font-family: inherit;
    cursor: pointer;
  }
</style>
<script>
(() => {
  const FALLBACK_TARGETS = {
    hst: [
      { target: 'NGC 1300 Barred Spiral', inst: 'WFC3 / UVIS', mode: 'IMAGING', exp: '1,420 s' },
      { target: 'Eta Carinae Homunculus', inst: 'ACS / HRC', mode: 'SPECTROSCOPY', exp: '900 s' },
      { target: 'M51 Whirlpool Galaxy', inst: 'WFC3 / IR', mode: 'IMAGING', exp: '1,800 s' }
    ],
    jwst: [
      { target: 'SMACS 0723 Deep Field', inst: 'NIRCam / MIRI', mode: 'MOSAIC', exp: '2,650 s' },
      { target: 'WASP-39b Exoplanet Transit', inst: 'NIRSpec / G395H', mode: 'TRANSMISSION', exp: '1,920 s' },
      { target: 'Carina Nebula Rim (NGC 3324)', inst: 'MIRI / IMAGER', mode: 'MID-IR', exp: '2,100 s' }
    ]
  };

  function makeObservatoryCard(key, title, cls, url) {
    const card = document.createElement('div');
    card.className = 'obs-card ' + cls;
    card.innerHTML =
      '<div class="obs-top">' +
        '<span class="obs-name"><span class="obs-pulse"></span>' + title + '</span>' +
        '<a class="obs-ext" href="' + url + '" target="_blank" rel="noopener">LIVE SKY &#8599;</a>' +
      '</div>' +
      '<div class="obs-target">' +
        '<div class="obs-label">ACTIVE / RECENT TARGET</div>' +
        '<div class="obs-val" id="obs-t-' + key + '">Syncing telemetry...</div>' +
      '</div>' +
      '<div class="obs-grid">' +
        '<div class="obs-cell"><span class="obs-label">INSTRUMENT</span><b id="obs-i-' + key + '">--</b></div>' +
        '<div class="obs-cell"><span class="obs-label">MODE</span><b id="obs-m-' + key + '">--</b></div>' +
        '<div class="obs-cell"><span class="obs-label">EXPOSURE</span><b id="obs-e-' + key + '">--</b></div>' +
      '</div>' +
      '<div class="obs-foot">' +
        '<span id="obs-src-' + key + '">FEED: INIT</span>' +
        '<button class="obs-refresh" id="obs-btn-' + key + '">POLL NOW</button>' +
      '</div>';
    return card;
  }

  function applySample(key, item, sourceLabel) {
    document.getElementById('obs-t-' + key).textContent = item.target;
    document.getElementById('obs-i-' + key).textContent = item.inst;
    document.getElementById('obs-m-' + key).textContent = item.mode;
    document.getElementById('obs-e-' + key).textContent = item.exp;
    document.getElementById('obs-src-' + key).textContent = sourceLabel + ' · ' + new Date().toLocaleTimeString();
  }

  async function pollObservatory(key, query) {
    const pool = FALLBACK_TARGETS[key];
    const slot = Math.floor(Date.now() / 30000) % pool.length;
    try {
      const r = await fetch('https://images-api.nasa.gov/search?q=' + encodeURIComponent(query) + '&media_type=image&page_size=8');
      if (!r.ok) throw new Error('HTTP');
      const d = await r.json();
      const hits = (d.collection?.items || []).map((it) => it.data?.[0]?.title).filter(Boolean);
      if (hits.length) {
        const picked = hits[slot % hits.length];
        applySample(key, { ...pool[slot], target: picked.slice(0, 64) }, 'NASA MAST/ARCHIVE');
        return;
      }
      throw new Error('EMPTY');
    } catch {
      applySample(key, pool[slot], 'TELEMETRY RELAY');
    }
  }

  function mountTelescopes() {
    if (document.getElementById('telescope-feeds')) return true;
    const host = document.querySelector('main') || document.getElementById('root') || document.body;
    if (!host) return false;
    const section = document.createElement('section');
    section.id = 'telescope-feeds';
    section.appendChild(makeObservatoryCard('hst', 'HUBBLE // OBSERVATORY', '', 'https://spacetelescopelive.org/hubble'));
    section.appendChild(makeObservatoryCard('jwst', 'JAMES WEBB // OBSERVATORY', 'jwst', 'https://spacetelescopelive.org/webb'));
    host.appendChild(section);

    pollObservatory('hst', 'hubble observation galaxy nebula');
    pollObservatory('jwst', 'james webb telescope infrared');
    document.getElementById('obs-btn-hst').onclick = () => pollObservatory('hst', 'hubble observation galaxy nebula');
    document.getElementById('obs-btn-jwst').onclick = () => pollObservatory('jwst', 'james webb telescope infrared');
    setInterval(() => {
      pollObservatory('hst', 'hubble observation galaxy nebula');
      pollObservatory('jwst', 'james webb telescope infrared');
    }, 30000);
    return true;
  }

  const timer = setInterval(() => {
    if (mountTelescopes()) clearInterval(timer);
  }, 350);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- TELESCOPE-FEEDS-END -->
</body>
