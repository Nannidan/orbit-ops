<!-- CONSTELLATION-BG-START -->
<script>
(() => {
  const sets = [
    [
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#00f0ff" stroke-opacity="0.45" stroke-width="1"><line x1="16" y1="8" x2="36" y2="10"/><line x1="16" y1="8" x2="22" y2="21"/><line x1="36" y1="10" x2="32" y2="23"/><line x1="22" y1="21" x2="27" y2="22"/><line x1="27" y1="22" x2="32" y2="23"/><line x1="22" y1="21" x2="18" y2="36"/><line x1="32" y1="23" x2="38" y2="34"/><line x1="18" y1="36" x2="38" y2="34"/></g><g fill="#e6f4ff"><circle cx="16" cy="8" r="1.7"/><circle cx="36" cy="10" r="1.5"/><circle cx="22" cy="21" r="1.4"/><circle cx="27" cy="22" r="1.4"/><circle cx="32" cy="23" r="1.4"/><circle cx="18" cy="36" r="1.6"/><circle cx="38" cy="34" r="1.7"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">ORION</text></svg>',
      '<svg viewBox="0 0 120 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="10,16 24,28 38,18 52,30 66,16"/></g><g fill="#e6f4ff"><circle cx="10" cy="16" r="1.6"/><circle cx="24" cy="28" r="1.5"/><circle cx="38" cy="18" r="1.7"/><circle cx="52" cy="30" r="1.5"/><circle cx="66" cy="16" r="1.6"/></g><text x="74" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CASSIOPEIA</text></svg>'
    ],
    [
      '<svg viewBox="0 0 125 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="8,14 22,16 32,21 42,26 56,24 58,34 44,35 42,26"/></g><g fill="#e6f4ff"><circle cx="8" cy="14" r="1.5"/><circle cx="22" cy="16" r="1.5"/><circle cx="32" cy="21" r="1.5"/><circle cx="42" cy="26" r="1.5"/><circle cx="56" cy="24" r="1.7"/><circle cx="58" cy="34" r="1.6"/><circle cx="44" cy="35" r="1.5"/></g><text x="66" y="25" fill="#7c93b0" font-size="8" font-family="monospace">URSA MAJOR</text></svg>',
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#ff2a85" stroke-opacity="0.45" stroke-width="1"><line x1="26" y1="8" x2="26" y2="36"/><line x1="12" y1="22" x2="40" y2="18"/></g><g fill="#e6f4ff"><circle cx="26" cy="8" r="1.8"/><circle cx="26" cy="20" r="1.6"/><circle cx="26" cy="36" r="1.5"/><circle cx="12" cy="22" r="1.4"/><circle cx="40" cy="18" r="1.4"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CYGNUS</text></svg>'
    ]
  ];

  let currentIdx = 0;

  function renderStrip(el) {
    el.innerHTML = sets[currentIdx].join('');
  }

  function inject() {
    if (document.querySelector('.constellation-strip')) return true;
    const container = document.querySelector('main') || document.querySelector('#root > div');
    if (!container || container.children.length < 2) return false;
    const strip = document.createElement('div');
    strip.className = 'constellation-strip';
    renderStrip(strip);
    container.insertBefore(strip, container.children[1]);
    return true;
  }

  window.addEventListener('deviceorientation', (e) => {
    if (typeof e.alpha !== 'number') return;
    const idx = ((e.alpha % 360) + 360) % 360 < 180 ? 0 : 1;
    if (idx !== currentIdx) {
      currentIdx = idx;
      const el = document.querySelector('.constellation-strip');
      if (el) renderStrip(el);
    }
  }, true);

  const timer = setInterval(() => {
    if (inject()) clearInterval(timer);
  }, 300);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- CONSTELLATION-BG-END -->

<!-- TELESCOPE-FEEDS-START -->
<style>
  #telescope-feeds {
    width: 100%;
    max-width: 1280px;
    margin: 14px auto 72px auto;
    padding: 0 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .tel-card {
    background: rgba(5, 9, 17, 0.95);
    border: 1px solid rgba(0, 240, 255, 0.28);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tel-card.jwst {
    border-color: rgba(255, 184, 0, 0.34);
  }
  .tel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: #00f0ff;
  }
  .tel-card.jwst .tel-head {
    color: #ffb800;
  }
  .tel-live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tel-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #39ff14;
    box-shadow: 0 0 8px #39ff14;
  }
  .tel-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  .tel-stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tel-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 18px 10px 7px 10px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: none;
  }
  .tel-cap-title {
    font-size: 11px;
    font-weight: 700;
    color: #e6f4ff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tel-cap-meta {
    font-size: 9px;
    color: #00f0ff;
  }
  .tel-card.jwst .tel-cap-meta {
    color: #ffb800;
  }
  .tel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 10px;
    color: #7c93b0;
  }
  .tel-actions {
    display: flex;
    gap: 5px;
  }
  .tel-btn {
    background: rgba(255, 255, 255, 0.06);
    color: #e6f4ff;
    border: 1px solid rgba(0, 240, 255, 0.28);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 10px;
    font-family: inherit;
    cursor: pointer;
  }
</style>
<script>
(() => {
  const CONFIGS = {
    hst: {
      title: 'HUBBLE // LIVE FEED',
      cls: '',
      query: 'hubble space telescope nebula galaxy',
      fallback: [
        { title: 'NGC 1300 Barred Spiral Galaxy (WFC3)', date: 'NASA Archive', url: 'https://images-assets.nasa.gov/image/PIA04216/PIA04216~medium.jpg' }
      ]
    },
    jwst: {
      title: 'JAMES WEBB // LIVE FEED',
      cls: 'jwst',
      query: 'james webb space telescope',
      fallback: [
        { title: 'Carina Nebula Cosmic Cliffs (NIRCam)', date: 'NASA Archive', url: 'https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e002135/GSFC_20171208_Archive_e002135~medium.jpg' }
      ]
    }
  };

  function makeCard(key) {
    const cfg = CONFIGS[key];
    const card = document.createElement('div');
    card.className = 'tel-card ' + cfg.cls;
    card.innerHTML =
      '<div class="tel-head">' +
        '<span class="tel-live"><span class="tel-dot"></span>' + cfg.title + '</span>' +
        '<span id="tel-cnt-' + key + '" style="font-size:10px;color:#39ff14">SYNCING...</span>' +
      '</div>' +
      '<div class="tel-stage">' +
        '<img id="tel-img-' + key + '" alt="' + cfg.title + '" />' +
        '<div class="tel-overlay">' +
          '<div class="tel-cap-title" id="tel-ti-' + key + '">Loading observation feed...</div>' +
          '<div class="tel-cap-meta" id="tel-me-' + key + '">NASA IMAGE API</div>' +
        '</div>' +
      '</div>' +
      '<div class="tel-bar">' +
        '<span id="tel-st-' + key + '">AUTO-CYCLE 15s</span>' +
        '<div class="tel-actions">' +
          '<button class="tel-btn" id="tel-prev-' + key + '">&lt;</button>' +
          '<button class="tel-btn" id="tel-next-' + key + '">&gt;</button>' +
          '<button class="tel-btn" id="tel-sync-' + key + '">SYNC</button>' +
        '</div>' +
      '</div>';
    return card;
  }

  async function initFeed(key) {
    const cfg = CONFIGS[key];
    const img = document.getElementById('tel-img-' + key);
    const ti = document.getElementById('tel-ti-' + key);
    const me = document.getElementById('tel-me-' + key);
    const cnt = document.getElementById('tel-cnt-' + key);
    const st = document.getElementById('tel-st-' + key);

    let items = cfg.fallback.slice();
    let idx = 0;

    function renderItem(n) {
      if (!items.length) return;
      idx = ((n % items.length) + items.length) % items.length;
      const cur = items[idx];
      img.onerror = () => {
        if (items.length > 1) {
          items.splice(idx, 1);
          renderItem(idx);
        }
      };
      img.src = cur.url;
      ti.textContent = cur.title;
      me.textContent = cur.date + ' · FEED #' + (idx + 1);
      cnt.textContent = 'LIVE · ' + (idx + 1) + '/' + items.length;
    }

    async function fetchLive() {
      cnt.textContent = 'POLLING...';
      try {
        const res = await fetch('https://images-api.nasa.gov/search?q=' + encodeURIComponent(cfg.query) + '&media_type=image&year_start=2022');
        if (!res.ok) throw new Error('HTTP');
        const data = await res.json();
        const parsed = (data.collection?.items || [])
          .map((it) => {
            const thumb = (it.links || []).find((l) => l.render === 'image' || (l.href && l.href.match(/.(jpg|jpeg|png)$/i)))?.href || it.links?.[0]?.href;
            return {
              url: thumb,
              title: it.data?.[0]?.title || 'Observatory Target',
              date: (it.data?.[0]?.date_created || '').slice(0, 10) || 'NASA'
            };
          })
          .filter((x) => x.url)
          .slice(0, 25);
        if (parsed.length) {
          items = parsed;
          renderItem(0);
          st.textContent = 'LIVE · ' + new Date().toLocaleTimeString();
          return;
        }
        throw new Error('EMPTY');
      } catch {
        renderItem(idx);
        st.textContent = 'CACHED · ' + new Date().toLocaleTimeString();
      }
    }

    document.getElementById('tel-prev-' + key).onclick = () => renderItem(idx - 1);
    document.getElementById('tel-next-' + key).onclick = () => renderItem(idx + 1);
    document.getElementById('tel-sync-' + key).onclick = fetchLive;

    await fetchLive();
    setInterval(() => renderItem(idx + 1), 15000);
    setInterval(fetchLive, 180000);
  }

  function mount() {
    if (document.getElementById('telescope-feeds')) return true;
    const host = document.querySelector('main') || document.getElementById('root') || document.body;
    if (!host) return false;
    const wrap = document.createElement('section');
    wrap.id = 'telescope-feeds';
    wrap.appendChild(makeCard('hst'));
    wrap.appendChild(makeCard('jwst'));
    host.appendChild(wrap);
    initFeed('hst');
    initFeed('jwst');
    return true;
  }

  const timer = setInterval(() => {
    if (mount()) clearInterval(timer);
  }, 350);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- TELESCOPE-FEEDS-END -->
</body>
</html>
