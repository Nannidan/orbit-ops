<script>
(() => {
  const sets = [
    [
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#00f0ff" stroke-opacity="0.45" stroke-width="1"><line x1="16" y1="8" x2="36" y2="10"/><line x1="16" y1="8" x2="22" y2="21"/><line x1="36" y1="10" x2="32" y2="23"/><line x1="22" y1="21" x2="27" y2="22"/><line x1="27" y1="22" x2="32" y2="23"/><line x1="22" y1="21" x2="18" y2="36"/><line x1="32" y1="23" x2="38" y2="34"/><line x1="18" y1="36" x2="38" y2="34"/></g><g fill="#e6f4ff"><circle cx="16" cy="8" r="1.7"/><circle cx="36" cy="10" r="1.5"/><circle cx="22" cy="21" r="1.4"/><circle cx="27" cy="22" r="1.4"/><circle cx="32" cy="23" r="1.4"/><circle cx="18" cy="36" r="1.6"/><circle cx="38" cy="34" r="1.7"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">ORION</text></svg>',
      '<svg viewBox="0 0 120 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="10,16 24,28 38,18 52,30 66,16"/></g><g fill="#e6f4ff"><circle cx="10" cy="16" r="1.6"/><circle cx="24" cy="28" r="1.5"/><circle cx="38" cy="18" r="1.7"/><circle cx="52" cy="30" r="1.5"/><circle cx="66" cy="16" r="1.6"/></g><text x="74" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CASSIOPEIA</text></svg>'
    ],
    [
      '<svg viewBox="0 0 125 44" fill="none"><g stroke="#b44cff" stroke-opacity="0.45" stroke-width="1"><polyline points="8,14 22,16 32,21 42,26 56,24 58,34 44,35 42,26"/></g><g fill="#e6f4ff"><circle cx="8" cy="14" r="1.5"/><circle cx="22" cy="16" r="1.5"/><circle cx="32" cy="21" r="1.5"/><circle cx="42" cy="26" r="1.5"/><circle cx="56" cy="24" r="1.7"/><circle cx="58" cy="34" r="1.6"/><circle cx="44" cy="35" r="1.5"/></g><text x="66" y="25" fill="#7c93b0" font-size="8" font-family="monospace">URSA MAJOR</text></svg>',
      '<svg viewBox="0 0 110 44" fill="none"><g stroke="#ff2a85" stroke-opacity="0.45" stroke-width="1"><line x1="26" y1="8" x2="26" y2="36"/><line x1="12" y1="22" x2="40" y2="18"/></g><g fill="#e6f4ff"><circle cx="26" cy="8" r="1.8"/><circle cx="26" cy="20" r="1.6"/><circle cx="26" cy="36" r="1.5"/><circle cx="12" cy="22" r="1.4"/><circle cx="40" cy="18" r="1.4"/></g><text x="48" y="25" fill="#7c93b0" font-size="8" font-family="monospace">CYGNUS</text></svg>'
    ]
  ];

  let currentIdx = 0;

  function renderStrip(el) {
    el.innerHTML = sets[currentIdx].join('');
  }

  function inject() {
    if (document.querySelector('.constellation-strip')) return true;
    const container = document.querySelector('main') || document.querySelector('#root > div');
    if (!container || container.children.length < 2) return false;
    const strip = document.createElement('div');
    strip.className = 'constellation-strip';
    renderStrip(strip);
    container.insertBefore(strip, container.children[1]);
    return true;
  }

  window.addEventListener('deviceorientation', (e) => {
    if (typeof e.alpha !== 'number') return;
    const idx = ((e.alpha % 360) + 360) % 360 < 180 ? 0 : 1;
    if (idx !== currentIdx) {
      currentIdx = idx;
      const el = document.querySelector('.constellation-strip');
      if (el) renderStrip(el);
    }
  }, true);

  const timer = setInterval(() => {
    if (inject()) clearInterval(timer);
  }, 300);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>

<style>

</style>
<script>
(() => {
  const CONFIGS = {
    hst: {
      title: 'HUBBLE // IN-PAGE VIEW',
      cls: '',
      accent: '#00f0ff',
      secondary: '#b44cff',
      query: 'hubble space telescope nebula galaxy',
      fallback: [
        { title: 'NGC 1300 Barred Spiral Galaxy (WFC3)', date: 'NASA Archive', url: 'https://images-assets.nasa.gov/image/PIA04216/PIA04216~medium.jpg' }
      ],
      targets: [
        { name: 'ORION NEBULA (M42)', kind: 'nebula', inst: 'WFC3/UVIS', band: 'H-ALPHA + OIII', ra: '05h 35m 17s', dec: '-05° 23′ 28″', c1: 'rgba(0,240,255,0.34)', c2: 'rgba(255,42,133,0.28)' },
        { name: 'NGC 1300 BARRED SPIRAL', kind: 'spiral', inst: 'ACS/WFC', band: 'OPTICAL COMPOSITE', ra: '03h 19m 41s', dec: '-19° 24′ 41″', c1: 'rgba(180,76,255,0.34)', c2: 'rgba(0,240,255,0.26)' },
        { name: 'CRAB NEBULA (M1)', kind: 'nebula', inst: 'WFC3/IR', band: 'SYNCHROTRON', ra: '05h 34m 32s', dec: '+22° 00′ 52″', c1: 'rgba(57,255,20,0.28)', c2: 'rgba(0,240,255,0.32)' }
      ]
    },
    jwst: {
      title: 'JAMES WEBB // IN-PAGE VIEW',
      cls: 'jwst',
      accent: '#ffb800',
      secondary: '#ff2a85',
      query: 'james webb space telescope',
      fallback: [
        { title: 'Carina Nebula Cosmic Cliffs (NIRCam)', date: 'NASA Archive', url: 'https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e002135/GSFC_20171208_Archive_e002135~medium.jpg' }
      ],
      targets: [
        { name: 'CARINA CLIFFS (NGC 3324)', kind: 'nebula', inst: 'NIRCam + MIRI', band: 'NEAR/MID-IR', ra: '10h 45m 08s', dec: '-59° 52′ 04″', c1: 'rgba(255,184,0,0.36)', c2: 'rgba(255,42,133,0.28)' },
        { name: 'ANDROMEDA DUST (M31)', kind: 'spiral', inst: 'MIRI/IMAGER', band: 'MID-IR 7.7-21um', ra: '00h 42m 44s', dec: '+41° 16′ 09″', c1: 'rgba(255,184,0,0.32)', c2: 'rgba(180,76,255,0.28)' },
        { name: 'WASP-39b EXOPLANET', kind: 'spectra', inst: 'NIRSpec/G395H', band: 'TRANSIT IR', ra: '14h 29m 18s', dec: '-03° 26′ 40″', c1: 'rgba(255,184,0,0.32)', c2: 'rgba(0,240,255,0.26)' }
      ]
    }
  };

  function drawSpikes(ctx, x, y, len, color, t) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    const rot = Math.sin(t * 0.2) * 0.04;
    for (let k = 0; k < 3; k++) {
      const ang = rot + (k * Math.PI) / 3;
      const dx = Math.cos(ang) * len;
      const dy = Math.sin(ang) * len;
      ctx.beginPath();
      ctx.moveTo(x - dx, y - dy);
      ctx.lineTo(x + dx, y + dy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function startInPageCanvas(key, cfg, getTargetIndex) {
    const cvs = document.getElementById('tel-cvs-' + key);
    const ctx = cvs.getContext('2d');
    const stars = Array.from({ length: 95 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.4 + 0.25,
      a: Math.random() * Math.PI * 2,
      spike: Math.random() < 0.14
    }));

    function render(now) {
      if (cvs.style.display !== 'none') {
        const w = cvs.clientWidth || 320;
        const h = cvs.clientHeight || 200;
        if (cvs.width !== w || cvs.height !== h) {
          cvs.width = w;
          cvs.height = h;
        }
        const t = now * 0.001;
        const idx = getTargetIndex() % cfg.targets.length;
        const tgt = cfg.targets[idx];
        const cx = w * 0.54;
        const cy = h * 0.48;
        const rad = Math.min(w, h) * 0.42;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        const g1 = ctx.createRadialGradient(cx - rad * 0.15, cy - rad * 0.1, 4, cx, cy, rad * 1.15);
        g1.addColorStop(0, tgt.c1);
        g1.addColorStop(0.55, tgt.c2);
        g1.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g1;
        ctx.beginPath();
        ctx.arc(cx, cy, rad * 1.15, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 1.5 + s.a));
          const sx = s.x * w;
          const sy = s.y * h;
          ctx.fillStyle = 'rgba(235,248,255,' + tw.toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
          ctx.fill();
          if (s.spike && tw > 0.65) {
            drawSpikes(ctx, sx, sy, 6 + s.r * 3, 'rgba(255,255,255,' + (tw * 0.45).toFixed(2) + ')', t);
          }
        }

        if (tgt.kind === 'spiral') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(0.45 + t * 0.03);
          ctx.scale(1.15, 0.52);
          for (let arm = 0; arm < 2; arm++) {
            ctx.strokeStyle = arm === 0 ? cfg.accent : cfg.secondary;
            ctx.globalAlpha = 0.52;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            for (let step = 0; step <= 48; step++) {
              const frac = step / 48;
              const ang = frac * Math.PI * 2.4 + arm * Math.PI;
              const dist = frac * rad * 0.85;
              const px = Math.cos(ang) * dist;
              const py = Math.sin(ang) * dist;
              if (step === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
          }
          ctx.restore();
        } else if (tgt.kind === 'nebula') {
          ctx.save();
          ctx.strokeStyle = cfg.accent;
          ctx.globalAlpha = 0.42;
          ctx.lineWidth = 1.4;
          for (let f = 0; f < 5; f++) {
            ctx.beginPath();
            for (let x = cx - rad * 0.8; x <= cx + rad * 0.8; x += 8) {
              const norm = (x - cx) / (rad * 0.8);
              const y = cy + Math.sin(norm * 3.2 + f * 0.9 + t * 0.35) * (rad * 0.35) - (f - 2) * 7;
              if (x === cx - rad * 0.8) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.save();
          ctx.strokeStyle = cfg.accent;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let px = 20; px < w - 20; px += 4) {
            const u = (px - 20) / Math.max(1, w - 40);
            const dip = Math.exp(-Math.pow((u - 0.52) * 14, 2)) * 28;
            const py = cy + 12 - dip + Math.sin(u * 26 + t * 1.4) * 3;
            if (px === 20) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.restore();
        }

        drawSpikes(ctx, cx, cy, 14, cfg.accent, t);

        ctx.fillStyle = '#e6f4ff';
        ctx.font = '10px monospace';
        ctx.fillText(tgt.name + ' [' + tgt.band + ']', 10, 16);
        ctx.fillStyle = cfg.accent;
        ctx.fillText(tgt.inst + ' · RA ' + tgt.ra + ' · DEC ' + tgt.dec, 10, h - 10);
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }

  function makeCard(key) {
    const cfg = CONFIGS[key];
    const card = document.createElement('div');
    card.className = 'tel-card ' + cfg.cls;
    card.innerHTML =
      '<div class="tel-head">' +
        '<span class="tel-live"><span class="tel-dot"></span>' + cfg.title + '</span>' +
        '<span id="tel-cnt-' + key + '" style="font-size:10px;color:#39ff14">IN-PAGE ART</span>' +
      '</div>' +
      '<div class="tel-stage">' +
        '<img id="tel-img-' + key + '" alt="' + cfg.title + '" style="display:none" />' +
        '<canvas id="tel-cvs-' + key + '"></canvas>' +
        '<div class="tel-overlay" id="tel-ov-' + key + '" style="display:none">' +
          '<div class="tel-cap-title" id="tel-ti-' + key + '">Loading observation feed...</div>' +
          '<div class="tel-cap-meta" id="tel-me-' + key + '">NASA IMAGE API</div>' +
        '</div>' +
      '</div>' +
      '<div class="tel-bar">' +
        '<span id="tel-st-' + key + '">ARTISTIC FIELD · TARGET 1/' + cfg.targets.length + '</span>' +
        '<div class="tel-actions">' +
          '<button class="tel-btn active" id="tel-m-inpage-' + key + '">IN-PAGE VIEW</button>' +
          '<button class="tel-btn" id="tel-m-feed-' + key + '">LIVE FEED</button>' +
          '<button class="tel-btn" id="tel-prev-' + key + '">&lt;</button>' +
          '<button class="tel-btn" id="tel-next-' + key + '">&gt;</button>' +
        '</div>' +
      '</div>';
    return card;
  }

  async function initFeed(key) {
    const cfg = CONFIGS[key];
    const img = document.getElementById('tel-img-' + key);
    const cvs = document.getElementById('tel-cvs-' + key);
    const ov = document.getElementById('tel-ov-' + key);
    const ti = document.getElementById('tel-ti-' + key);
    const me = document.getElementById('tel-me-' + key);
    const cnt = document.getElementById('tel-cnt-' + key);
    const st = document.getElementById('tel-st-' + key);
    const mFeed = document.getElementById('tel-m-feed-' + key);
    const mInpage = document.getElementById('tel-m-inpage-' + key);

    let items = cfg.fallback.slice();
    let imgIdx = 0;
    let artIdx = 0;
    let mode = 'inpage';

    startInPageCanvas(key, cfg, () => artIdx);

    function syncStatus() {
      if (mode === 'inpage') {
        const tgt = cfg.targets[artIdx % cfg.targets.length];
        cnt.textContent = 'IN-PAGE ART';
        st.textContent = tgt.name + ' · ' + ((artIdx % cfg.targets.length) + 1) + '/' + cfg.targets.length;
      } else {
        cnt.textContent = 'LIVE · ' + (imgIdx + 1) + '/' + items.length;
        st.textContent = 'NASA FEED · ' + ((imgIdx + 1) + '/' + items.length);
      }
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isFeed = mode === 'feed';
      img.style.display = isFeed ? 'block' : 'none';
      ov.style.display = isFeed ? 'flex' : 'none';
      cvs.style.display = isFeed ? 'none' : 'block';
      mFeed.classList.toggle('active', isFeed);
      mInpage.classList.toggle('active', !isFeed);
      syncStatus();
    }

    function renderItem(n) {
      if (!items.length) return;
      imgIdx = ((n % items.length) + items.length) % items.length;
      const cur = items[imgIdx];
      img.onerror = () => {
        if (items.length > 1) {
          items.splice(imgIdx, 1);
          renderItem(imgIdx);
        }
      };
      img.src = cur.url;
      ti.textContent = cur.title;
      me.textContent = cur.date + ' · FEED #' + (imgIdx + 1);
      syncStatus();
    }

    async function fetchLive() {
      try {
        const res = await fetch('https://images-api.nasa.gov/search?q=' + encodeURIComponent(cfg.query) + '&media_type=image&year_start=2022');
        if (!res.ok) throw new Error('HTTP');
        const data = await res.json();
        const parsed = (data.collection?.items || [])
          .map((it) => {
            const thumb = (it.links || []).find((l) => l.render === 'image' || (l.href && l.href.match(/.(jpg|jpeg|png)$/i)))?.href || it.links?.[0]?.href;
            return {
              url: thumb,
              title: it.data?.[0]?.title || 'Observatory Target',
              date: (it.data?.[0]?.date_created || '').slice(0, 10) || 'NASA'
            };
          })
          .filter((x) => x.url)
          .slice(0, 25);
        if (parsed.length) {
          items = parsed;
          renderItem(0);
        }
      } catch {
        renderItem(imgIdx);
      }
    }

    mFeed.onclick = () => setMode('feed');
    mInpage.onclick = () => setMode('inpage');
    document.getElementById('tel-prev-' + key).onclick = () => {
      if (mode === 'inpage') {
        artIdx = (artIdx - 1 + cfg.targets.length) % cfg.targets.length;
        syncStatus();
      } else {
        renderItem(imgIdx - 1);
      }
    };
    document.getElementById('tel-next-' + key).onclick = () => {
      if (mode === 'inpage') {
        artIdx = (artIdx + 1) % cfg.targets.length;
        syncStatus();
      } else {
        renderItem(imgIdx + 1);
      }
    };

    syncStatus();
    await fetchLive();
    setInterval(() => {
      artIdx = (artIdx + 1) % cfg.targets.length;
      if (mode === 'inpage') syncStatus();
      else renderItem(imgIdx + 1);
    }, 15000);
    setInterval(fetchLive, 180000);
  }

  function mount() {
    if (document.getElementById('telescope-feeds')) return true;
    const host = document.querySelector('main') || document.getElementById('root') || document.body;
    if (!host) return false;
    const wrap = document.createElement('section');
    wrap.id = 'telescope-feeds';
    wrap.appendChild(makeCard('hst'));
    wrap.appendChild(makeCard('jwst'));
    host.appendChild(wrap);
    initFeed('hst');
    initFeed('jwst');
    return true;
  }

  const timer = setInterval(() => {
    if (mount()) clearInterval(timer);
  }, 350);
  setTimeout(() => clearInterval(timer), 8000);
})();
</script>
<!-- TELESCOPE-FEEDS-END -->
